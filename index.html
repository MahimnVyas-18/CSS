<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS </title>
    <!--internal css-->
    <style>
        body{
            background-color:rgb(65, 9, 9);
            padding:20px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        h1{
            color:yellow;
            text-align:center;
            padding:20px;
            text-transform:uppercase;
        }
        p{
            line-height:2.5;
            color:white;
            text-transform:uppercase;
            text-align:center;
        }
        a{
            background-color:rgb(119, 35, 202);
            padding:10px;
            color:rgb(29, 171, 124);
            text-decoration:none;
            border-radius:10px;
        }


        
    </style>
</head>
<body>





    <h1 >Inline CSS demo</h1>
    <p >
        this para introduces inline styling .the text has a specific
        line-height for better readability.
    </p>
    <p >this para will be bold and blue.</p>
    <a
   href="">Click Me!</a>
    
</body>
</html>
